[project]
name = "central-api"
version = "0.1.0"
description = "MrBot V3 central-api: plano de control (API v3, scheduler, flota). Sin Playwright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mrbot-contracts>=1.0,<2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.1",
  "httpx>=0.27",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
