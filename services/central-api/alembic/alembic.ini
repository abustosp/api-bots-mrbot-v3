# Configuracion Alembic de central-api (plan 01 §9.1). Una sola cabeza PG.
# Uso: alembic -c services/central-api/alembic/alembic.ini upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
sourceless = false
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
