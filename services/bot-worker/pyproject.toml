[project]
name = "mrbot-bot-worker"
version = "3.0.0"
description = "MrBot API V3 bot-worker: ejecutor remoto efimero sin estado (plano de datos)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "mrbot-contracts>=1.0,<2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=41",
  "pdfplumber>=0.11.10",
  # Pisos de seguridad (hallazgos Trivy HIGH/CRITICAL con fix publicado).
  # pdfplumber>=0.11.10 trae pdfminer.six==20260107 y rompe el pin
  # vulnerable pdfminer.six==20231228 que exigía 0.11.4.
  "urllib3>=2.8.0",
  "msgpack>=1.2.3",
  "pdfminer.six>=20251230",
  "setuptools>=78.1.1",
  "certifi>=2026.6.17",
  # Scripts _logger de bots_dev/ (declaracion_en_linea parsea HTML; liquidacion_granos usa pandas).
  "pandas>=2.0",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.scripts]
bot-worker = "bot_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_worker"]

[tool.hatch.build]
artifacts = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
