[project]
name = "mrbot-bot-worker"
version = "3.0.0"
description = "MrBot API V3 bot-worker: ejecutor remoto efimero sin estado (plano de datos)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=41",
]

[project.scripts]
bot-worker = "bot_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_worker"]

[tool.hatch.build]
artifacts = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
