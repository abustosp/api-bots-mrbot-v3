# Despliegue rápido del worker (sección worker).
# Uso (host dedicado, sin central ni db locales):
#   cp worker.env.example .env.worker
#   # completar CENTRAL_URL, WORKER_ADVERTISED_URL y WORKER_CONCURRENCY
#   # permitir la URL anunciada en WORKER_NODES de la central
#   docker compose -f worker.compose.yaml --env-file .env.worker up -d
#   docker compose -f worker.compose.yaml --env-file .env.worker \
#     exec bot-worker python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/internal/v1/health', timeout=2).read()[:60])"
#
# Invariantes (igual que el stack completo):
#   W-1/SEC-3: sin secretos de la central ni DATABASE_URL/RSA/MinIO.
#   W-2: concurrencia máxima 10 (tope duro); el valor local predeterminado es 5.
#   W-3: sin puertos publicados; todo entra por `command:` y asignación sellada.

name: mrbot-v3-worker

services:
  bot-worker:
    image: ${WORKER_IMAGE:-mrbot-bot-worker:dev}
    init: true
    # Sin `env_file` ni `environment` a propósito: el worker no lee entorno.
    command:
      - python
      - -u
      - -m
      - bot_worker
      - --central-url
      - ${CENTRAL_URL:?fijar URL de la central (http://central:8000 o https://central.ejemplo.com)}
      - --advertised-url
      - ${WORKER_ADVERTISED_URL:?fijar URL propia http(s)://IP:8080}
      - --concurrency
      - ${WORKER_CONCURRENCY:-5}
      - --image-version
      - ${APP_VERSION:-3.0.0-dev}
      - --image-digest
      - ${WORKER_IMAGE_DIGEST:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal/v1/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3G
          pids: 512
        reservations:
          memory: 2G
    stop_grace_period: 150s
    shm_size: "2gb"
    tmpfs:
      - /dev/shm:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=1777
      - /work:rw,nosuid,nodev,size=4g,uid=10001,gid=10001,mode=1777
      - /tmp:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1777
    read_only: true
    restart: unless-stopped

  # Updater de host (opcional): permite el botón "Actualizar" del panel central.
  # Solo conexiones salientes hacia la central; recrea `bot-worker` con la imagen
  # que ordena la central. Es el único servicio con docker socket: el worker
  # sigue sin él (W-3). Requiere UPDATER_TOKEN, UPDATER_DOCKER_CONFIG y UPDATER_HOST_DIR (ruta absoluta
  # de este directorio, montada con la misma ruta dentro del contenedor porque
  # compose resuelve rutas relativas contra el host).
  worker-updater:
    image: ${UPDATER_IMAGE:-mrbot-worker-updater:dev}
    profiles: [updater]
    init: true
    environment:
      UPDATER_CENTRAL_URL: ${CENTRAL_URL:-}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_NODE: ${UPDATER_NODE:-}
      UPDATER_ALLOWED_REPOS: ${UPDATER_ALLOWED_REPOS:-}
      UPDATER_COMPOSE_FILE: ${UPDATER_HOST_DIR:-}/worker.compose.yaml
      UPDATER_ENV_FILE: ${UPDATER_HOST_DIR:-}/${UPDATER_ENV_NAME:-.env.worker}
      UPDATER_PROJECT: ${UPDATER_PROJECT:-mrbot-v3-worker}
      UPDATER_SERVICE: ${UPDATER_SERVICE:-bot-worker}
      UPDATER_HEALTH_TIMEOUT: ${UPDATER_HEALTH_TIMEOUT:-180}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${UPDATER_HOST_DIR:-/nonexistent}:${UPDATER_HOST_DIR:-/nonexistent}
      # Credenciales del registry (docker login del host) para `docker pull`.
      - ${UPDATER_DOCKER_CONFIG:-/dev/null}:/root/.docker/config.json:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
