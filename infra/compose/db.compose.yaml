# Despliegue rápido de la base de datos (sección db).
# Uso:
#   cp db.env.example .env.db
#   docker compose -f db.compose.yaml --env-file .env.db up -d
#   docker compose -f db.compose.yaml --env-file .env.db exec postgres \
#     pg_isready -U "${POSTGRES_USER:-mrbot_app}" -d "${POSTGRES_DB:-mrbot}"
#
# Es la misma imagen y healthcheck del stack completo
# (infra/compose/docker-compose.yml), aislada para levantar solo
# PostgreSQL 17 en un host dedicado. La central y el migrate se conectan
# con DATABASE_URL apuntando a este host/puerto.

name: mrbot-v3-db

services:
  postgres:
    image: postgres:17.6-bookworm
    env_file:
      - path: .env.db
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrbot}
      POSTGRES_USER: ${POSTGRES_USER:-mrbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-despliegue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrbot_app} -d ${POSTGRES_DB:-mrbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
