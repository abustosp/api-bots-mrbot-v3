# Central en blue/green sobre el stack de produccion (docker-compose.yml).
# Una instancia por color, siempre con `-p mrbot-central-<color>` (lo hace
# infra/deploy/bluegreen.sh). Extiende el central-api real (secrets, certs,
# S3, mTLS, limites) y se une a las redes/volumenes YA creados por el stack
# `${STACK:-mrbot-v3}` (Postgres no se toca). Ambos colores comparten la ruta
# de nginx-v2 (misma etiqueta nginx.host.route), que reparte solo entre
# contenedores healthy. No publica puertos al host.
#
# Drenaje sin cambiar nginx-v2: el healthcheck falla si existe /tmp/drain, asi
# nginx-v2 saca al contenedor mientras el proceso termina sus requests.
# El alias DNS `central-api` en la red control lo mantiene para los workers.

services:
  migrate:
    extends:
      file: docker-compose.yml
      service: migrate
    depends_on: !reset {}
    networks: [control]

  central-api:
    extends:
      file: docker-compose.yml
      service: central-api
    build: !reset null
    depends_on: !reset {}
    ports: !reset []
    # shortcut: el autoscaler corre en ambos colores durante el solapamiento
    # (~1 min); no se verifico que sea seguro, dejarlo en false si preocupa.
    environment:
      AUTOSCALE_ENABLED: ${AUTOSCALE_ENABLED:-false}
    labels:
      nginx.host.enable: "${CENTRAL_NGINX:-true}"
      nginx.host.route: "${CENTRAL_ROUTE:-central-api}"
      nginx.host.domains: "${CENTRAL_DOMAIN:?definir CENTRAL_DOMAIN}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request; sys.exit(1) if os.path.exists('/tmp/drain') else urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s

# Mismos nombres que declara docker-compose.yml para el stack ${STACK}.
networks:
  edge:
    external: true
    name: proxy-edge
  control:
    external: true
    name: ${STACK:-mrbot-v3}_control
  storage:
    external: true
    name: ${STACK:-mrbot-v3}_storage

volumes:
  apoc_base:
    external: true
    name: ${STACK:-mrbot-v3}_apoc_base

secrets:
  database_url: {file: ./secrets/database_url.txt}
  api_key_hmac_secret: {file: ./secrets/api_key_hmac_secret.txt}
  session_signing_key: {file: ./secrets/session_signing_key.txt}
  rsa_private_key: {file: ./secrets/rsa_private_key.pem}
  assignment_signing_key: {file: ./secrets/assignment_signing_key.pem}
  smtp_password: {file: ./secrets/smtp_password.txt}
  minio_central_credentials: {file: ./secrets/minio_central_credentials.txt}
  oidc_client_secret: {file: ./secrets/oidc_client_secret.txt}
  capmonster_arca_key: {file: ./secrets/capmonster_arca_key.txt}
  capmonster_srt_key: {file: ./secrets/capmonster_srt_key.txt}
