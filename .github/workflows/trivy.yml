name: trivy-scan

# Análisis de vulnerabilidades con Trivy.
# Cubre: central-api, bot-worker, worker-updater (imágenes que se
# construyen en este repo) + relay frps/frpc y postgres (imágenes
# externas del compose) + filesystem del repo (deps Python, secretos,
# misconfigurations de Dockerfiles/Compose).
#
# Resultados: tabla en el log + SARIF en la pestaña Security del repo.
# Si el build de bot-worker necesita la base privada
# (docker.abp.net.ar), definir estos secrets en el repo:
#   REGISTRY_URL (p. ej. docker.abp.net.ar), REGISTRY_USER, REGISTRY_PASS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 03:00 UTC: detecta CVEs nuevos sin depender de pushes.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy filesystem (repo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy FS (tabla en log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Trivy FS (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Subir SARIF (filesystem)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-built-images:
    name: Trivy imagen (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: central-api
            dockerfile: services/central-api/Dockerfile
            tag: mrbot-central-api:trivy
          - name: bot-worker
            dockerfile: services/bot-worker/Dockerfile
            tag: mrbot-bot-worker:trivy
          - name: worker-updater
            dockerfile: services/worker-updater/Dockerfile
            tag: mrbot-worker-updater:trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `secrets` no existe en expresiones `if:` de GitHub Actions, por eso
      # el login es un script que se omite solo cuando no hay credenciales.
      - name: Login registry privado (solo si hay secrets)
        run: |
          if [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_PASS" ]; then
            echo "$REGISTRY_PASS" | docker login "${REGISTRY_URL:-docker.abp.net.ar}" -u "$REGISTRY_USER" --password-stdin
          else
            echo "Sin credenciales del registry privado: se omite el login."
          fi
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}

      - name: Build ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.tag }} .

      # TEMPORAL-DEBUG: ubicar de dónde saca Trivy las versiones viejas
      # (tabla dice 2.7.0/1.1.2/70.3.0 pero el build instaló las nuevas).
      # Quitar este step cuando el misterio quede resuelto.
      - name: Debug temporal - contenido real de la imagen
        run: |
          docker run --rm --entrypoint sh ${{ matrix.tag }} -c '
            echo "== pip list ==";
            python3 -m pip list 2>/dev/null | grep -iE "urllib3|msgpack|setuptools|certifi|pdfminer|pdfplumber" || echo "(sin pip o sin coincidencias)";
            echo "== dist-infos con esos paquetes ==";
            ls -d /usr/local/lib/python3*/site-packages/*.dist-info /usr/lib/python3*/site-packages/*.dist-info /usr/local/lib/python3*/site-packages/*.egg-info 2>/dev/null | grep -iE "urllib3|msgpack|setuptools|certifi|pdfminer" || echo "(nada)";
            echo "== wheels sueltas en la imagen ==";
            find /app /wheels /tmp /root /home /opt -name "*.whl" 2>/dev/null | head -20 || true;
            echo "== rastros de versiones viejas ==";
            find /usr /app /opt -maxdepth 7 \( -name "urllib3-2.7.0*" -o -name "msgpack-1.1.2*" -o -name "setuptools-70.3.0*" \) 2>/dev/null | head -20 || true'

      - name: Trivy image (tabla en log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy image (SARIF)
        id: trivy_sarif
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"

      - name: Subir SARIF (${{ matrix.name }})
        if: always() && steps.trivy_sarif.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  trivy-external-images:
    name: Trivy imagen externa (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Imágenes de terceros referenciadas en infra/compose:
        # relay (frps en la central, frpc en worker-relay) + postgres.
        # Mantener en sync con infra/compose/*.yaml. Excepciones
        # documentadas (falsos positivos, root requerido): docs/trivy-exceptions.md.
        image:
          - fatedier/frps:v0.61.2
          - fatedier/frpc:v0.61.2
          - postgres:17.9-bookworm
    steps:
      - name: Trivy image (tabla en log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.image }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Trivy image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.image }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-external.sarif
          exit-code: "0"

      - name: Subir SARIF (${{ matrix.image }})
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-external.sarif
          # Categoría única por imagen (solo minúsculas, sin ":" ni "/").
          category: trivy-external-${{ strategy.job-index }}
